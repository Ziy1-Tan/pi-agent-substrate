# The actor may reach the model provider over TLS. An `http` rule contributes
# no SNI rule and the handshake is denied; use `https`. See AGENTS.md.
#
# The API key is not here or in the actor: the template holds a placeholder,
# and `replaceHeaders` swaps the auth header for the Secret's value on the way
# out. The placeholders are filled in by deploy/local.sh.
metadata:
  atespace: pi-agents
  name: default
rules:
- https:
    hostnames:
    - ${PROVIDER_HOST}
    ports:
      numbers:
      - ${PROVIDER_PORT}
    effects:
      replaceHeaders:
      - header: ${AUTH_HEADER}
        prefix: "${AUTH_PREFIX}"
        credentialUri: ${CREDENTIAL_URI}
