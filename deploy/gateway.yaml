# The gateway answers POST /messages and walks each conversation's actor
# through its idle lifecycle. It authenticates with its projected pod
# certificate twice: to atenet-router, which must list this ServiceAccount's
# SPIFFE ID in --ingress-allowed-spiffe-ids, and to ate-api, where the
# atespace's access policy grants that SPIFFE ID `editor`. ate-api's
# NetworkPolicy admits only namespaces labeled ate.dev/api-access=true.
#
# GATEWAY_NAME names the Service and Deployment, so a second gateway can run
# beside the first; GATEWAY_EGRESS_CONFIGMAP holds the per-actor policy.
apiVersion: v1
kind: Namespace
metadata:
  name: pi-gateway
  labels:
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pi-gateway
  namespace: pi-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: ${GATEWAY_NAME}
  namespace: pi-gateway
spec:
  selector:
    app: ${GATEWAY_NAME}
  ports:
    - name: http
      port: 8788
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${GATEWAY_NAME}
  namespace: pi-gateway
  labels:
    app: ${GATEWAY_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${GATEWAY_NAME}
  template:
    metadata:
      labels:
        app: ${GATEWAY_NAME}
    spec:
      serviceAccountName: pi-gateway
      containers:
        - name: gateway
          image: ${GATEWAY_IMAGE}
          # The tag is reused across rebuilds; always pull so a rollout cannot
          # keep running the previous binary from the node's image cache.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8788
          env:
            - name: ATESPACE
              value: ${ATESPACE}
            - name: ACTOR_TEMPLATE
              value: ${ACTOR_TEMPLATE}
            - name: IDLE_SECONDS
              value: "${IDLE_SECONDS}"
          volumeMounts:
            - name: pod-identity
              mountPath: /run/pi-identity
            - name: egress
              mountPath: /etc/pi
      volumes:
        - name: pod-identity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: service-ca.pem
        - name: egress
          configMap:
            name: ${GATEWAY_EGRESS_CONFIGMAP}
