# The worker image is the ateworker-<class> build that matches the installed
# substrate. Render with ATESPACE, WORKERPOOL_NAME, SANDBOX_CLASS_NAME,
# SANDBOX_CONFIG_NAME, and WORKER_IMAGE set. A microVM pool only schedules on a
# node that advertises ate.dev/kvm.
#
# ActorTemplate.workerSelector matches the sandboxClass label, so a pool of
# this class is chosen even when the cluster runs both classes.
apiVersion: v1
kind: Namespace
metadata:
  name: ${ATESPACE}
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: ${WORKERPOOL_NAME}
  namespace: ${ATESPACE}
  labels:
    workload: pi
    sandboxClass: ${SANDBOX_CLASS_NAME}
spec:
  # Two workers: an actor occupies its whole worker, so each concurrent
  # conversation needs its own. The kind node has 8 cores (colima default
  # profile); each worker requests 1.
  replicas: 2
  sandboxClasses:
    - name: ${SANDBOX_CLASS_NAME}
      configRef:
        name: ${SANDBOX_CONFIG_NAME}
  template:
    # One core per worker: the worker pod size is the per-actor ceiling, and the
    # actor's own size is the template's resources (1000m), which fits inside it.
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: "1"
        memory: 2Gi
  workerImage: ${WORKER_IMAGE}
